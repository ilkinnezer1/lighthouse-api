name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The datasource carries no `url` (driver adapter), so this needs no
      # database — but the client is generated into node_modules, which is
      # never committed, so the build cannot typecheck without it.
      - run: pnpm prisma generate

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test
